# Minimal SearXNG configuration for Gentoo
# See /etc/searxng/settings.yml for the full config

[uwsgi]
# Run as searxng user/group
uid = searxng
gid = searxng

# Socket for Nginx reverse proxy
socket = /usr/lib/searxng/run/socket
chmod-socket = 660

# Python virtual environment
home = /usr/lib/searxng/searx-pyenv
pythonpath = /usr/lib/searxng/searxng-src
chdir = /usr/lib/searxng/searxng-src

# WSGI application
wsgi-file = /usr/lib/searxng/searxng-src/searx/webapp.py
callable = application
master = true

# Process management
processes = 4
threads = 4
cheaper = 2

# Logging
logto = /var/log/searxng/uwsgi.log
logfile-chown = true
logger = file:/var/log/searxng/uwsgi.log

# Buffer sizes
buffer-size = 8192
post-buffering = 8192

# Reload on settings change
touch-reload = /etc/searxng/settings.yml

# Die on timeout
die-on-term = true

# HTTP port for direct access
http = 127.0.0.1:8888

# Load python plugin
plugins = python314

# Critical: load apps in each worker after forking
# SearXNG's asyncio loop needs to be per-process
lazy-apps = true
